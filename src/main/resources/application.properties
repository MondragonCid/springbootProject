# Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3307/dbCRUD1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Auto create/update tables based on entities
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Disable stacktrace display in errors
server.error.include-stacktrace=never

# Server port
server.port=8080